name: Build RaceDay

on:
  push:
    branches: [ part3-mvc ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build API
        run: dotnet build RaceDay.Api/RaceDay.Api.csproj --configuration Release

      - name: Build MVC
        run: dotnet build RaceDay.Mvc/RaceDay.Mvc.csproj --configuration Release

      - name: Build Docker image
        run: docker build -t raceday-mvc ./RaceDay.Mvc
